# 实景直播经营系统 —— Windows 发布包配置（electron-builder）
# 打包入口：pnpm --filter @liveops/live-desktop package（先跑 scripts/package-win.mjs 组装运行时）
appId: com.liveops.desktop
productName: 实景直播经营系统
copyright: Copyright © 2026 实景直播经营系统

directories:
  output: ../../release
  buildResources: build

# 打进 asar 的桌面端本体：主进程编译产物 + 渲染层构建产物
files:
  - dist-main/**/*
  - dist-renderer/**/*
  - package.json

# 随包携带的运行时：内置本地 API（pnpm deploy --config.node-linker=hoisted 平铺产物）与白名单知识证据
# 注意：extraResources 默认会过滤 node_modules，必须显式 filter 全部文件；
# 且 api-runtime 必须用 hoisted（平铺）布局——符号链接布局 electron-builder 不跟随，会导致内置 API 缺失
extraResources:
  - from: build/api-runtime-hoisted
    to: api-runtime
    filter:
      - "**/*"
  - from: build/docs
    to: docs
    filter:
      - "**/*"

asar: true

# 打包完成后把内置 API 的 node_modules 复制进包（extraResources 会过滤 node_modules）
afterPack: ./after-pack.mjs

win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-v${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 实景直播经营系统
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-v${version}-便携版.${ext}

electronLanguages:
  - zh-CN
  - en-US
